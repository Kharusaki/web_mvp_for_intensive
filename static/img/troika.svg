<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Кулоны Тройка">
  <defs>
    <radialGradient id="bg8" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3c2418"/>
      <stop offset="60%" stop-color="#241712"/>
      <stop offset="100%" stop-color="#150e0b"/>
    </radialGradient>
    <linearGradient id="gold8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b8"/>
      <stop offset="50%" stop-color="#dfa954"/>
      <stop offset="100%" stop-color="#a76a1f"/>
    </linearGradient>
    <linearGradient id="red8" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#e06050"/>
      <stop offset="100%" stop-color="#6c0f20"/>
    </linearGradient>
    <radialGradient id="glow8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8bf7a" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#e8bf7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg8)"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="#e8bf7a" stroke-opacity=".12"/>
  <circle cx="300" cy="300" r="190" fill="none" stroke="#e8bf7a" stroke-opacity=".07" stroke-dasharray="2 12"/>
  <circle cx="300" cy="330" r="180" fill="url(#glow8)"/>

  <!-- цепочка -->
  <path d="M300 76 v64" stroke="url(#gold8)" stroke-width="6" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="300" cy="152" r="14" fill="none" stroke="url(#gold8)" stroke-width="7"/>

  <!-- медальон -->
  <circle cx="300" cy="360" r="150" fill="#1d120e" stroke="url(#gold8)" stroke-width="12"/>
  <circle cx="300" cy="360" r="132" fill="none" stroke="url(#gold8)" stroke-width="3" stroke-opacity=".55"/>
  <circle cx="300" cy="360" r="118" fill="none" stroke="url(#gold8)" stroke-width="1.5" stroke-opacity=".3" stroke-dasharray="2 9"/>

  <!-- дуга-солнце -->
  <path d="M240 300 q60 -48 120 0" fill="none" stroke="url(#gold8)" stroke-width="5" stroke-linecap="round"/>

  <!-- тройка: три стилизованные лошади -->
  <g fill="url(#red8)" stroke="url(#gold8)" stroke-width="3">
    <path d="M252 404 c-4 -30 10 -48 26 -54 l-2 -16 12 12 10 -6 4 14 c14 8 20 24 16 50 c-10 -8 -18 -10 -26 -8 l0 18 -12 0 0 -16 c-10 -4 -18 -2 -28 6 z"/>
    <path d="M300 410 c-4 -38 12 -60 32 -66 l-2 -18 14 14 12 -8 5 16 c16 10 24 30 19 62 c-12 -10 -22 -12 -32 -8 l0 20 -14 0 0 -18 c-12 -6 -22 -2 -34 6 z"/>
    <path d="M354 404 c-4 -30 10 -48 28 -54 l-2 -16 12 12 10 -6 4 14 c14 8 20 24 16 50 c-10 -8 -18 -10 -26 -8 l0 18 -12 0 0 -16 c-10 -4 -20 -2 -30 6 z"/>
  </g>
  <g fill="#f6dfa8" fill-opacity=".85">
    <circle cx="296" cy="352" r="3"/>
    <circle cx="348" cy="348" r="3"/>
    <circle cx="400" cy="352" r="3"/>
  </g>

  <!-- лучи -->
  <g stroke="url(#gold8)" stroke-width="3" stroke-linecap="round" stroke-opacity=".7">
    <path d="M300 226 v14 M240 246 l7 12 M360 246 l-7 12 M210 292 l13 6 M390 292 l-13 6"/>
  </g>

  <path d="M438 430 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#f6dfa8" fill-opacity=".7"/>
  <path d="M156 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#f6dfa8" fill-opacity=".5"/>
</svg>
