<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Подвеска Кокошник">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3b2419"/>
      <stop offset="60%" stop-color="#241712"/>
      <stop offset="100%" stop-color="#150e0b"/>
    </radialGradient>
    <linearGradient id="gold5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b8"/>
      <stop offset="50%" stop-color="#dfa954"/>
      <stop offset="100%" stop-color="#a76a1f"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8bf7a" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#e8bf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red5" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#e06050"/>
      <stop offset="100%" stop-color="#6c0f20"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg5)"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="#e8bf7a" stroke-opacity=".12"/>
  <circle cx="300" cy="300" r="190" fill="none" stroke="#e8bf7a" stroke-opacity=".07" stroke-dasharray="2 12"/>

  <!-- цепочка -->
  <path d="M300 96 v58" stroke="url(#gold5)" stroke-width="6" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="300" cy="164" r="13" fill="none" stroke="url(#gold5)" stroke-width="7"/>

  <circle cx="300" cy="340" r="160" fill="url(#glow5)"/>

  <!-- кокошник -->
  <path d="M300 178 C218 200 160 268 156 368 L444 368 C440 268 382 200 300 178 Z"
        fill="#1d120e" stroke="url(#gold5)" stroke-width="11" stroke-linejoin="round"/>
  <path d="M300 204 C232 222 184 280 180 348 L420 348 C416 280 368 222 300 204 Z"
        fill="none" stroke="url(#gold5)" stroke-width="4" stroke-opacity=".65"/>

  <!-- зубцы -->
  <path d="M300 178 l0 -30 M224 198 l-14 -26 M376 198 l14 -26 M176 258 l-20 -16 M424 258 l20 -16"
        stroke="url(#gold5)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="300" cy="142" r="9" fill="url(#gold5)"/>
  <circle cx="208" cy="168" r="7" fill="url(#gold5)"/>
  <circle cx="392" cy="168" r="7" fill="url(#gold5)"/>
  <circle cx="154" cy="238" r="6" fill="url(#gold5)"/>
  <circle cx="446" cy="238" r="6" fill="url(#gold5)"/>

  <!-- резной орнамент -->
  <g fill="none" stroke="url(#gold5)" stroke-width="5" stroke-linecap="round">
    <path d="M300 238 c-26 30 -30 64 -8 92 c22 -28 18 -62 8 -92"/>
    <path d="M262 300 q-18 -22 -42 -18 M338 300 q18 -22 42 -18"/>
    <path d="M240 330 q-14 8 -20 20 M360 330 q14 8 20 20"/>
  </g>
  <circle cx="300" cy="290" r="15" fill="url(#red5)"/>
  <circle cx="216" cy="316" r="9" fill="url(#red5)"/>
  <circle cx="384" cy="316" r="9" fill="url(#red5)"/>
  <circle cx="300" cy="336" r="6" fill="url(#gold5)"/>

  <!-- подвески снизу -->
  <g stroke="url(#gold5)" stroke-width="3" fill="none">
    <path d="M216 368 v26 M258 368 v34 M300 368 v42 M342 368 v34 M384 368 v26"/>
  </g>
  <g fill="url(#red5)">
    <circle cx="216" cy="402" r="8"/>
    <circle cx="258" cy="410" r="8"/>
    <circle cx="300" cy="418" r="9"/>
    <circle cx="342" cy="410" r="8"/>
    <circle cx="384" cy="402" r="8"/>
  </g>

  <path d="M470 280 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#f6dfa8" fill-opacity=".7"/>
