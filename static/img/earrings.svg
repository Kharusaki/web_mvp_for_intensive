<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Серьги хохломской росписи">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3b2419"/>
      <stop offset="60%" stop-color="#241712"/>
      <stop offset="100%" stop-color="#150e0b"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9e4b4"/>
      <stop offset="50%" stop-color="#dfa954"/>
      <stop offset="100%" stop-color="#a96b20"/>
    </linearGradient>
    <linearGradient id="red2" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#d94a3e"/>
      <stop offset="100%" stop-color="#6c0f1f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg2)"/>
  <circle cx="300" cy="300" r="228" fill="none" stroke="#e8bf7a" stroke-opacity=".12"/>
  <circle cx="300" cy="300" r="188" fill="none" stroke="#e8bf7a" stroke-opacity=".07" stroke-dasharray="2 12"/>

  <!-- левая серьга -->
  <g>
    <path d="M225 150 a34 34 0 1 1 0 2 a34 34 0 0 1 0-2" fill="none" stroke="url(#gold2)" stroke-width="12"/>
    <path d="M225 168 v46" stroke="url(#gold2)" stroke-width="10" stroke-linecap="round"/>
    <path d="M225 214 c-52 40 -58 120 -6 176 c14 16 50 16 64 0 c52 -56 46 -136 -6 -176 c-16 -12 -36 -12 -52 0 z" fill="url(#gold2)"/>
    <path d="M225 236 c-34 30 -38 92 -4 138 c8 10 30 10 38 0 c34 -46 30 -108 -4 -138 c-8 -8 -22 -8 -30 0 z" fill="#120b09"/>
    <!-- хохломский мотив: узор по чёрному -->
    <path d="M225 262 c-16 20 -16 60 0 84 c16 -24 16 -64 0 -84" fill="none" stroke="url(#gold2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="225" cy="300" r="17" fill="url(#red2)"/>
    <path d="M198 276 q10 -14 24 -18 M252 276 q-10 -14 -24 -18 M198 330 q10 14 24 18 M252 330 q-10 14 -24 18" fill="none" stroke="url(#gold2)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="225" cy="378" r="10" fill="url(#red2)"/>
  </g>

  <!-- правая серьга -->
  <g transform="translate(150 0)">
    <path d="M225 150 a34 34 0 1 1 0 2 a34 34 0 0 1 0-2" fill="none" stroke="url(#gold2)" stroke-width="12"/>
    <path d="M225 168 v46" stroke="url(#gold2)" stroke-width="10" stroke-linecap="round"/>
    <path d="M225 214 c-52 40 -58 120 -6 176 c14 16 50 16 64 0 c52 -56 46 -136 -6 -176 c-16 -12 -36 -12 -52 0 z" fill="url(#gold2)"/>
    <path d="M225 236 c-34 30 -38 92 -4 138 c8 10 30 10 38 0 c34 -46 30 -108 -4 -138 c-8 -8 -22 -8 -30 0 z" fill="#120b09"/>
    <path d="M225 262 c-16 20 -16 60 0 84 c16 -24 16 -64 0 -84" fill="none" stroke="url(#gold2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="225" cy="300" r="17" fill="url(#red2)"/>
    <path d="M198 276 q10 -14 24 -18 M252 276 q-10 -14 -24 -18 M198 330 q10 14 24 18 M252 330 q-10 14 -24 18" fill="none" stroke="url(#gold2)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="225" cy="378" r="10" fill="url(#red2)"/>
  </g>

  <path d="M438 168 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#f6dfa8" fill-opacity=".7"/>
</svg>
