<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Царское колье">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3c2418"/>
      <stop offset="60%" stop-color="#241712"/>
      <stop offset="100%" stop-color="#150e0b"/>
    </radialGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9e5b6"/>
      <stop offset="50%" stop-color="#dea954"/>
      <stop offset="100%" stop-color="#a86a1f"/>
    </linearGradient>
    <linearGradient id="stone3" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ef7060"/>
      <stop offset="50%" stop-color="#b7213a"/>
      <stop offset="100%" stop-color="#5c0d1d"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8bf7a" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#e8bf7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg3)"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="#e8bf7a" stroke-opacity=".12"/>
  <circle cx="300" cy="300" r="190" fill="none" stroke="#e8bf7a" stroke-opacity=".07" stroke-dasharray="2 12"/>

  <!-- цепь -->
  <path d="M110 170 C170 330 430 330 490 170" fill="none" stroke="url(#gold3)" stroke-width="7" stroke-dasharray="3 14" stroke-linecap="round"/>
  <path d="M110 170 C165 290 435 290 490 170" fill="none" stroke="url(#gold3)" stroke-width="4" stroke-opacity=".7" stroke-dasharray="2 16"/>

  <!-- подвески на цепи -->
  <circle cx="176" cy="238" r="9" fill="url(#stone3)" stroke="#e8bf7a" stroke-width="3"/>
  <circle cx="424" cy="238" r="9" fill="url(#stone3)" stroke="#e8bf7a" stroke-width="3"/>
  <circle cx="300" cy="272" r="7" fill="url(#stone3)" stroke="#e8bf7a" stroke-width="3"/>

  <!-- медальон -->
  <circle cx="300" cy="360" r="132" fill="url(#glow3)"/>
  <path d="M300 300 v-28" stroke="url(#gold3)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="300" cy="392" r="96" fill="none" stroke="url(#gold3)" stroke-width="12"/>
  <circle cx="300" cy="392" r="76" fill="#1c120e" stroke="#7a5220" stroke-width="4"/>

  <!-- орнамент в медальоне -->
  <path d="M300 336 l24 30 -24 34 -24 -34 z" fill="url(#stone3)"/>
  <path d="M300 336 v64" stroke="#ff9c86" stroke-opacity=".5" stroke-width="3"/>
  <path d="M252 430 q48 34 96 0" fill="none" stroke="url(#gold3)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="258" cy="418" r="6" fill="url(#gold3)"/>
  <circle cx="342" cy="418" r="6" fill="url(#gold3)"/>
  <path d="M244 384 q14 -18 34 -20 M356 384 q-14 -18 -34 -20" fill="none" stroke="url(#gold3)" stroke-width="5" stroke-linecap="round"/>

  <!-- венчик над медальоном -->
  <path d="M270 300 l14 -22 16 14 16 -14 14 22" fill="none" stroke="url(#gold3)" stroke-width="6" stroke-linejoin="round"/>

  <path d="M446 300 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#f6dfa8" fill-opacity=".7"/>
  <path d="M140 380 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#f6dfa8" fill-opacity=".5"/>
</svg>
