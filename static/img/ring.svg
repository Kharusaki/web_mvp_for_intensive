    <linearGradient id="gem1" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#e86a5a"/>
      <stop offset="45%" stop-color="#b7213a"/>
      <stop offset="100%" stop-color="#5f0e1e"/>
