<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Кольцо с гранатом">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#3a2318"/>
      <stop offset="60%" stop-color="#241712"/>
      <stop offset="100%" stop-color="#160f0c"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e0ab"/>
      <stop offset="45%" stop-color="#dca651"/>
      <stop offset="100%" stop-color="#a76a1f"/>
