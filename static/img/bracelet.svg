<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Браслет Русское золото">
  <defs>
    <radialGradient id="bg6" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3c2418"/>
      <stop offset="60%" stop-color="#241712"/>
      <stop offset="100%" stop-color="#150e0b"/>
    </radialGradient>
    <linearGradient id="gold6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6b8"/>
      <stop offset="50%" stop-color="#dfa954"/>
      <stop offset="100%" stop-color="#a76a1f"/>
    </linearGradient>
    <linearGradient id="bead6" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ef7060"/>
      <stop offset="50%" stop-color="#b7213a"/>
      <stop offset="100%" stop-color="#5c0d1d"/>
    </linearGradient>
    <radialGradient id="glow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8bf7a" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#e8bf7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg6)"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="#e8bf7a" stroke-opacity=".12"/>
  <circle cx="300" cy="300" r="190" fill="none" stroke="#e8bf7a" stroke-opacity=".07" stroke-dasharray="2 12"/>
  <circle cx="300" cy="300" r="180" fill="url(#glow6)"/>

  <!-- кольцо браслета -->
  <circle cx="300" cy="320" r="150" fill="none" stroke="url(#gold6)" stroke-width="14"/>
  <circle cx="300" cy="320" r="150" fill="none" stroke="#3a2a10" stroke-opacity=".35" stroke-width="4"/>

  <!-- звенья -->
  <g fill="none" stroke="url(#gold6)" stroke-width="9">
    <ellipse cx="300" cy="170" rx="26" ry="16"/>
    <ellipse cx="418" cy="238" rx="26" ry="16" transform="rotate(56 418 238)"/>
    <ellipse cx="418" cy="402" rx="26" ry="16" transform="rotate(-56 418 402)"/>
    <ellipse cx="300" cy="470" rx="26" ry="16"/>
    <ellipse cx="182" cy="402" rx="26" ry="16" transform="rotate(56 182 402)"/>
    <ellipse cx="182" cy="238" rx="26" ry="16" transform="rotate(-56 182 238)"/>
  </g>

  <!-- бусины -->
  <g stroke="#f0cfa0" stroke-opacity=".4" stroke-width="2">
    <circle cx="240" cy="188" r="21" fill="url(#bead6)"/>
    <circle cx="384" cy="212" r="21" fill="url(#bead6)"/>
    <circle cx="432" cy="326" r="21" fill="url(#bead6)"/>
    <circle cx="360" cy="452" r="21" fill="url(#bead6)"/>
    <circle cx="216" cy="438" r="21" fill="url(#bead6)"/>
    <circle cx="168" cy="314" r="21" fill="url(#bead6)"/>
  </g>

  <!-- подвес-сорока -->
  <path d="M300 470 v34" stroke="url(#gold6)" stroke-width="6" stroke-dasharray="3 8"/>
  <circle cx="300" cy="516" r="26" fill="none" stroke="url(#gold6)" stroke-width="7"/>
  <path d="M300 504 l7 9 -7 11 -7 -11 z" fill="url(#bead6)"/>

  <path d="M450 170 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#f6dfa8" fill-opacity=".7"/>
  <path d="M132 330 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#f6dfa8" fill-opacity=".5"/>
</svg>
